<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIP-RANK-RUNNING</title>
  <style>#vip-metrics { display: none; }</style>
</head>
<body>
  <div id="root"></div>
  <pre id="vip-metrics">pending</pre>
  <script type="module">
    /* E2E probe halaman VIP (#/index/rewards/vip) terhadap bundle dist:
       suite=ok   : rank-levels + rank-status resolve setelah 1,5 dtk —
                    skeleton tampil dulu (tanpa konten mockup sama sekali),
                    lalu hero "Silver", progress "Menuju Gold"
                    Rp900.000 / Rp1.400.000 (bar 64%), daftar 6 tingkatan
                    dari rank-levels dengan Silver aktif.
       suite=fail : kedua endpoint balas 500 — skeleton berhenti, kartu
                    error "Gagal Memuat Data VIP" tampil, tanpa konten
                    mockup dan tanpa kartu tingkatan. */
    const suite = new URLSearchParams(location.search).get('suite') || 'ok';
    const metrics = { suite, errors: [], duringLoad: {}, afterLoad: {}, state: {} };
    window.addEventListener('error', (e) => metrics.errors.push(String(e.message)));
    window.addEventListener('unhandledrejection', (e) => metrics.errors.push(String(e.reason)));

    const json = (data, status = 200) => new Response(JSON.stringify(data), {
      status,
      headers: { 'Content-Type': 'application/json' },
    });
    const delay = (ms) => new Promise((r) => setTimeout(r, ms));

    const level = (rank, title, deposit, extra = {}) => ({
      rank,
      title,
      description: `Total aset isi ulang Rp ${deposit === 0 ? 0 : deposit.toLocaleString('id-ID')}`,
      missions_required_total: 0,
      downlines_total_required: 0,
      downlines_active_required: 0,
      deposit_self_total_required: `${deposit}.00`,
      team_deposit_level_1_total_required: '0.00',
      is_current_rank: false,
      is_unlocked: false,
      user_progress_val: 900000,
      ...extra,
    });

    const LEVELS = [
      level(1, 'Non VIP', 0, { is_unlocked: true }),
      level(2, 'Bronze', 50000, { is_unlocked: true }),
      level(3, 'Silver', 350000, { is_current_rank: true, is_unlocked: true }),
      level(4, 'Gold', 1400000),
      level(5, 'Platinum', 2500000),
      level(6, 'Diamond', 5000000),
    ];

    const STATUS = {
      current_rank: 3,
      current_title: 'Silver',
      completed_missions: 0,
      downlines_total: 0,
      downlines_active: 0,
      deposit_self_total: '900000.00',
      team_deposit_level_1_total: '0.00',
      next_rank: 4,
      next_title: 'Gold',
      next_required_missions: 0,
      next_required_downlines_total: 0,
      next_required_downlines_active: 0,
      next_required_deposit_self_total: '1400000.00',
      next_required_team_deposit_level_1_total: '0.00',
      progress_basis: 'deposit_self_total',
    };

    const realFetch = window.fetch.bind(window);
    window.fetch = async (url, init = {}) => {
      const target = String(url);
      if (target.includes('/api/auth/rank-status/')) {
        await delay(suite === 'fail' ? 300 : 1500);
        return suite === 'fail' ? json({}, 500) : json(STATUS);
      }
      if (target.includes('/api/auth/rank-levels/')) {
        await delay(suite === 'fail' ? 300 : 1500);
        return suite === 'fail' ? json({}, 500) : json(LEVELS);
      }
      if (target.includes('/api/')) return json({}, 200);
      if (target.includes('/index.html') || target.includes('/assets/')) return realFetch(url, init);
      /* Sumber eksternal dsb. — jangan keluar jaringan. */
      return json({}, 404);
    };

    window.localStorage.setItem('je_auth_session', JSON.stringify({ access: 'e2e-token' }));
    if (!location.hash) location.hash = '#/index/rewards/vip';

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const writeMetrics = () => {
      document.getElementById('vip-metrics').textContent = JSON.stringify(metrics, null, 2);
      document.title = 'VIP-RANK-DONE';
    };
    const waitFor = async (fn, timeout = 12000) => {
      const start = performance.now();
      while (performance.now() - start < timeout) {
        const value = fn();
        if (value) return value;
        await sleep(50);
      }
      return null;
    };
    const text = (selector) => document.querySelector(selector)?.textContent.trim() ?? null;
    const MOCKUPS = ['Gold Member', 'Menuju Platinum', 'Rp3.512.870'];
    const pageText = () => document.querySelector('.page-vip')?.textContent || '';
    const mockupsLeft = () => MOCKUPS.filter((s) => pageText().includes(s));

    /* Nama asset ber-hash diambil dari index.html dist, lalu bundle diimpor
       supaya SPA berjalan persis seperti produksi. */
    const html = await (await realFetch('/index.html')).text();
    for (const m of html.matchAll(/href="(\/assets\/[^"]+\.css)"/g)) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = m[1];
      document.head.appendChild(link);
    }
    const entry = html.match(/src="(\/assets\/[^"]+\.js)"/);
    if (!entry) {
      metrics.fatal = 'entry asset not found';
      writeMetrics();
      throw new Error('no entry asset');
    }

    await import(entry[1]);

    if (suite === 'fail') {
      /* Endpoint 500 diretry apiClient (2x) — tunggu sampai kartu error tampil. */
      const card = await waitFor(() => document.querySelector('.page-vip .notif-card.error'));
      metrics.state.errorTitle = text('.page-vip .notification-title');
      metrics.state.errorDesc = text('.page-vip .notification-desc');
      metrics.state.skeletonLeft = document.querySelectorAll('.page-vip .skeleton').length;
      metrics.state.tierCardsLeft = document.querySelectorAll('.page-vip .tier-card').length;
      metrics.state.mockups = mockupsLeft();
      metrics.allPassed = Boolean(card)
        && metrics.state.errorTitle === 'Gagal Memuat Data VIP'
        && metrics.state.errorDesc === 'Server sedang bermasalah. Coba lagi beberapa saat lagi ya.'
        && metrics.state.skeletonLeft === 0
        && metrics.state.tierCardsLeft === 0
        && metrics.state.mockups.length === 0
        && metrics.errors.length === 0;
      writeMetrics();
    } else {
      /* Fase 1 — skeleton: sebelum 1,5 dtk, yang tampil hanya kerangka. */
      await waitFor(() => document.querySelector('.page-vip .skeleton'));
      await sleep(350);
      metrics.duringLoad.skeletonCount = document.querySelectorAll('.page-vip .skeleton').length;
      metrics.duringLoad.heroTitle = text('.page-vip .status-title');
      metrics.duringLoad.tierNames = document.querySelectorAll('.page-vip .tier-name').length;
      metrics.duringLoad.mockups = mockupsLeft();

      /* Fase 2 — data live dari kedua endpoint. */
      await waitFor(() => text('.page-vip .status-title') === 'Silver');
      await sleep(200);
      metrics.afterLoad.heroTitle = text('.page-vip .status-title');
      metrics.afterLoad.progressLabel = text('.page-vip .progress-label');
      metrics.afterLoad.progressAmount = text('.page-vip .progress-amount');
      metrics.afterLoad.progressWidth = document.querySelector('.page-vip .progress-bar-fill')?.style.width ?? null;

      const tiers = [...document.querySelectorAll('.page-vip .tier-card')].map((card) => ({
        title: card.querySelector('.tier-name')?.textContent.trim() ?? '',
        active: card.classList.contains('active'),
        locked: card.classList.contains('locked'),
        badge: card.querySelector('.current-level-badge')?.textContent.trim() ?? '',
      }));
      metrics.afterLoad.tierCount = tiers.length;
      metrics.afterLoad.activeTitle = tiers.find((t) => t.active)?.title ?? null;
      metrics.afterLoad.badgeTitles = tiers.filter((t) => t.badge).map((t) => t.title);
      metrics.afterLoad.lockedTitles = tiers.filter((t) => t.locked).map((t) => t.title);
      metrics.afterLoad.skeletonLeft = document.querySelectorAll('.page-vip .skeleton').length;
      metrics.afterLoad.mockups = mockupsLeft();

      const d = metrics.duringLoad;
      const a = metrics.afterLoad;
      metrics.allPassed = d.skeletonCount >= 10
        && d.heroTitle === null
        && d.tierNames === 0
        && d.mockups.length === 0
        && a.heroTitle === 'Silver'
        && a.progressLabel === 'Menuju Gold'
        && a.progressAmount === 'Rp900.000 / Rp1.400.000'
        && a.progressWidth === '64%'
        && a.tierCount === 6
        && a.activeTitle === 'Silver'
        && JSON.stringify(a.badgeTitles) === JSON.stringify(['Silver'])
        && JSON.stringify(a.lockedTitles) === JSON.stringify(['Gold', 'Platinum', 'Diamond'])
        && a.skeletonLeft === 0
        && a.mockups.length === 0
        && metrics.errors.length === 0;
      writeMetrics();
    }
  </script>
</body>
</html>
