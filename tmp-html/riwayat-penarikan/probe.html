<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RIWAYAT-PENARIKAN-E2E-RUNNING</title>
</head>
<body>
  <div id="root"></div>
  <pre id="metrics">pending</pre>
  <script type="module">
    /* Verifikasi tombol back di RiwayatPenarikan.jsx (header): tombol harus
       SELALU menuju Beranda (#/index/home) — bukan kembali ke halaman
       sebelumnya lewat history.back().
       Riwayat in-app disimulasikan lewat history.state.idx > 0 (seperti
       kondisi nyata saat halaman dibuka dari RiwayatTransaksi/DetailPenarikan);
       perilaku lama (goBack) pada kondisi ini akan memanggil history.back()
       dan TIDAK menuju Beranda. */
    const metrics = { scenario: 'riwayat-penarikan-back', errors: [] };
    window.addEventListener('error', (e) => metrics.errors.push(String(e.message)));
    window.addEventListener('unhandledrejection', (e) => metrics.errors.push(String(e.reason)));

    /* Satu baris WITHDRAW contoh supaya daftar riwayat terisi. */
    const WITHDRAW_ROWS = [
      {
        id: 7701,
        type: 'WITHDRAW',
        amount: '100000.00',
        status: 'COMPLETED',
        created_at: '2026-09-15 18:52:00',
        bank_name: 'BCA',
        bank_account_number: '8830011223',
        withdrawal_service_name: 'Bank Transfer',
        withdrawal_fee: '2500.00',
        withdrawal_net_amount: '97500.00',
        description: 'Withdraw to bank',
      },
    ];

    const envelope = (results) => ({ count: results.length, next: null, previous: null, results });

    const realFetch = window.fetch.bind(window);
    window.fetch = async (url, init = {}) => {
      const target = String(url);
      if (target.includes('/api/transactions/')) {
        const rows = target.includes('type=WITHDRAW') ? WITHDRAW_ROWS : [];
        return new Response(JSON.stringify(envelope(rows)), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        });
      }
      if (target.includes('/api/')) {
        return new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } });
      }
      return realFetch(url, init);
    };

    window.localStorage.setItem('je_auth_session', JSON.stringify({ access: 'e2e-token' }));
    if (!location.hash) location.hash = '#/index/transactions/riwayat-penarikan';

    /* Nama asset ber-hash diambil dari index.html dist, lalu bundle diimpor
       supaya SPA berjalan persis seperti produksi. */
    const html = await (await realFetch('/index.html')).text();
    for (const m of html.matchAll(/href="(\/assets\/[^"]+\.css)"/g)) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = m[1];
      document.head.appendChild(link);
    }
    const entry = html.match(/src="(\/assets\/[^"]+\.js)"/);
    if (!entry) {
      metrics.fatal = 'entry asset not found';
      document.getElementById('metrics').textContent = JSON.stringify(metrics, null, 2);
      throw new Error('no entry asset');
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const waitFor = async (fn, timeout = 10000) => {
      const start = performance.now();
      while (performance.now() - start < timeout) {
        const value = fn();
        if (value) return value;
        await sleep(50);
      }
      return null;
    };

    await import(entry[1]);

    await waitFor(() => document.querySelector('.page-riwayat-penarikan'));
    const backBtn = await waitFor(() => document.querySelector('.page-riwayat-penarikan .back-btn'));
    metrics.backBtnFound = Boolean(backBtn);
    await waitFor(() => document.querySelectorAll('.page-riwayat-penarikan .transaction-card').length >= 1, 6000);

    /* Simulasi riwayat in-app: react-router menandai posisi entri lewat
       history.state.idx; idx > 0 berarti ada halaman sebelumnya di dalam app. */
    window.history.replaceState({ ...(window.history.state || {}), idx: 1 }, '', location.href);
    /* Spy: perilaku baru tidak boleh memakai history.back(); pemanggilan asli
       tidak diteruskan supaya halaman probe tidak benar-benar berpindah keluar. */
    window.history.back = () => { metrics.historyBackCalled = true; };

    metrics.hashBefore = location.hash;
    backBtn?.click();
    await waitFor(() => location.hash.startsWith('#/index/home'), 5000);
    await sleep(300);

    metrics.hashAfter = location.hash;
    metrics.historyBackCalled = Boolean(metrics.historyBackCalled);
    metrics.riwayatGone = !document.querySelector('.page-riwayat-penarikan');
    metrics.homeMounted = Boolean(document.querySelector('.page-home'));

    metrics.passed = metrics.backBtnFound
      && metrics.hashAfter === '#/index/home'
      && metrics.historyBackCalled === false
      && metrics.riwayatGone
      && metrics.homeMounted
      && metrics.errors.length === 0;

    document.getElementById('metrics').textContent = JSON.stringify(metrics, null, 2);
  </script>
</body>
</html>
