<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">

  <style id="sections-styles">
/* CSS for section section:Header */
#section-header {
  width: 100%;
}
.header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 22px 20px 16px;
}
.back-btn {
  width: 38px;
  height: 38px;
  background-color: #f6f1e9;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-decoration: none;
}
.back-btn img {
  width: 18px;
  height: 18px;
}
.header-title {
  color: #1a1410;
  font-size: 16px;
  font-weight: 700;
  margin: 0;
}
.progress-container {
  display: flex;
  gap: 6px;
  padding: 0 20px 20px;
}
.progress-bar {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, #ffc93c 0%, #e8790c 100%);
}

/* CSS for section section:Hero */
#section-hero {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 4px;
}
.hero-image {
  width: 199px;
  height: 214px;
  object-fit: contain;
}

/* CSS for section section:Content */
.title-margin {
  padding-bottom: 10px;
}
.main-title {
  font-size: 24px;
  font-weight: 700;
  color: #1a1410;
  margin: 0;
  line-height: 1.2;
}
.desc-margin {
  padding-bottom: 27px;
}
.main-desc {
  font-size: 14px;
  color: #514840;
  margin: 0;
  line-height: 1.5;
}

/* CSS for section section:Form */
.label-margin {
  padding: 16px 0 8px 0;
}
.form-label {
  font-size: 12px;
  font-weight: 700;
  color: #514840;
  display: block;
}
.input-container {
  display: flex;
  align-items: center;
  gap: 12px;
  background-color: #f6f1e9;
  border-radius: 14px;
  padding: 14px 16px;
}
.input-icon {
  width: 20px;
  height: 20px;
}
.form-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 14px;
  color: #1a1410;
  font-family: 'Inter', sans-serif;
  width: 100%;
}
.form-input::placeholder {
  color: #a79c8f;
}
.icon-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn img {
  width: 20px;
  height: 20px;
}
.rules-margin {
  padding-top: 16px;
}
.validation-rules {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rule-item {
  display: flex;
  align-items: center;
  gap: 10px;
}
.check-circle {
  width: 16px;
  height: 16px;
  background-color: #3fa66b;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}
.check-circle img {
  width: 10px;
  height: 10px;
}
.rule-text {
  font-size: 12px;
  color: #514840;
}

/* CSS for section section:Footer */
#section-footer {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.spacer {
  flex: 1;
  min-height: 40px;
}
.submit-btn {
  background-color: #f1b04a;
  color: #1a1410;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: 5px;
  padding: 15px;
  width: 100%;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  text-align: center;
  transition: background-color 0.2s;
}
.submit-btn:hover {
  background-color: #e0a03a;
}
  </style>
  <script src="global.js" defer></script>
</head>

<section id="section-header">

<section id="section-content">
    <div class="title-margin">

    </div>
  </section>
<section id="section-form">
    <div class="label-margin">

    </div>

    <div class="label-margin">

    </div>

      <button type="button" class="icon-btn"><img src="images/11_377.svg" alt="Toggle Visibility"></button>
    </div>

    <div class="rules-margin">
      <ul class="validation-rules">
        <li class="rule-item">
          <div class="check-circle">
            <img src="images/11_384.svg" alt="Check">
          </div>
          <span class="rule-text">Minimal 6 karakter</span>
        </li>
        <li class="rule-item">
          <div class="check-circle">
            <img src="images/11_389.svg" alt="Check">
          </div>
          <span class="rule-text">Kombinasi huruf & angka</span>
        </li>
      </ul>
    </div>
  </section>
<section id="section-footer">
    <div class="spacer"></div>
    <button class="submit-btn">Simpan Password</button>
  </section>
</main>
