<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Register */
.app-container {
    width: 100%;
    max-width: 412px;
    min-height: 100vh;
    background-color: var(--color-bg);
    /* Approximating the complex Figma radial gradients */
    background-image: 
      radial-gradient(circle at 85% 5%, rgba(255, 201, 60, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 15% 95%, rgba(255, 159, 28, 0.12) 0%, transparent 45%);
    box-shadow: 0px 30px 60px 0px rgba(26, 20, 16, 0.18);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .app-header {
    display: flex;
    align-items: center;
    padding: 22px 20px 16px 20px;
    gap: 14px;
  }

  .btn-back {
    width: 38px;
    height: 38px;
    background-color: var(--color-surface);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.2s ease;
  }

  .btn-back:hover {
    background-color: #ebe4d8;
  }

  .header-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--color-text-primary);
    margin: 0;
  }

  .progress-container {
    display: flex;
    gap: 6px;
    padding: 0 20px 20px 20px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    border-radius: 2px;
  }

  .progress-bar.active-gradient {
    background: linear-gradient(90deg, #ffc93c 0%, #e8790c 100%);
  }

  .progress-bar.inactive {
    background-color: var(--color-progress-bg);
  }

  .main-content {
    padding: 4px 24px 40px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .step-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-primary);
    margin-bottom: 6px;
  }

  .page-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--color-text-primary);
    margin: 0 0 10px 0;
    line-height: 1.2;
  }

  .page-description {
    font-size: 14px;
    color: var(--color-text-secondary);
    margin: 0 0 24px 0;
    line-height: 1.5;
  }

  .register-form {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .input-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-text-secondary);
    margin-bottom: 8px;
  }

  .input-wrapper {
    display: flex;
    align-items: center;
    background-color: var(--color-surface);
    border-radius: 14px;
    padding: 14px 16px;
    gap: 12px;
  }

  .input-field {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    color: var(--color-text-primary);
    outline: none;
    width: 100%;
  }

  .input-field::placeholder {
    color: var(--color-text-tertiary);
  }

  .btn-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  .btn-icon:hover {
    opacity: 1;
  }

  .requirements-list {
    list-style: none;
    padding: 0;
    margin: 8px 0 0 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .requirement-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-check {
    width: 16px;
    height: 16px;
    background-color: var(--color-success);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }

  .requirement-text {
    font-size: 12px;
    color: var(--color-text-secondary);
  }

  .form-actions {
    margin-top: 32px;
  }

  .btn-submit {
    width: 100%;
    background-color: var(--color-text-primary);
    color: var(--color-white);
    font-size: 16px;
    font-weight: 600;
    padding: 15px;
    border-radius: 5px;
    text-align: center;
    transition: background-color 0.2s ease;
  }

  .btn-submit:hover {
    background-color: #2a221b;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-register" class="app-container">
  <header class="app-header">
    <button class="btn-back" aria-label="Kembali">
      <img src="images/15_328.svg" alt="">
    </button>
    <h1 class="header-title">Buat Password</h1>
  </header>

  <nav class="progress-container" aria-label="Progress pendaftaran">
    <div class="progress-bar active-gradient"></div>
    <div class="progress-bar active-gradient"></div>
    <div class="progress-bar inactive"></div>
  </nav>

  <main class="main-content">
    <div class="step-text">Langkah 2 dari 3</div>
    <h2 class="page-title">Amankan Akun Kamu</h2>
    <p class="page-description">Buat password yang kuat dan belum pernah kamu pakai sebelumnya.</p>

    <form class="register-form" action="#" method="POST">
      <div class="form-group">
        <label for="password" class="input-label">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="input-field" placeholder="Masukkan password">
          <button type="button" class="btn-icon" aria-label="Tampilkan password">
            <img src="images/15_353.svg" alt="">
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password" class="input-label">Konfirmasi Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirm-password" class="input-field" placeholder="Ulangi password">
          <button type="button" class="btn-icon" aria-label="Tampilkan password">
            <img src="images/15_363.svg" alt="">
          </button>
        </div>
      </div>

      <ul class="requirements-list">
        <li class="requirement-item">
          <span class="icon-check">
            <img src="images/15_370.svg" alt="">
          </span>
          <span class="requirement-text">Minimal 6 karakter</span>
        </li>
        <li class="requirement-item">
          <span class="icon-check">
            <img src="images/15_375.svg" alt="">
          </span>
          <span class="requirement-text">Kombinasi huruf & angka</span>
        </li>
      </ul>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Lanjut</button>
      </div>
    </form>
  </main>
</section>
</body>
</html>
