<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KOMUNITAS-RUNNING</title>
</head>
<body>
  <div id="root"></div>
  <pre id="komunitas-metrics">pending</pre>
  <script type="module">
    /* E2E probe untuk popup "Gabung Komunitas Kami" di Home (Home.jsx).
       Dua fase dalam satu run Edge, dipisah reload dokumen asli:
       fase 1 — buka Home → popup muncul (judul/badge/3 tombol + href dari
                GET /api/support/links/ ids 13/12/11), X menutup tanpa
                meninggalkan /index/home, lalu Profil → Home: popup TIDAK
                muncul lagi (masih page load yang sama) → simpan hasil, reload;
       fase 2 — setelah refresh, popup HARUS muncul lagi di page load baru;
                klik di dalam kartu modal TIDAK menutup, tap area overlay
                menutup popup.
       Hasil fase 1 + fase 2 digabung ke metrics akhir. */
    const probePath = location.pathname; /* '/tmp-html/komunitas/index.html' */
    const phase = sessionStorage.getItem('km_phase') || '1';
    const metrics = { phase, errors: [], state: {} };
    window.addEventListener('error', (e) => metrics.errors.push(String(e.message)));
    window.addEventListener('unhandledrejection', (e) => metrics.errors.push(String(e.reason)));

    const json = (data, status = 200) => new Response(JSON.stringify(data), {
      status,
      headers: { 'Content-Type': 'application/json' },
    });
    window.fetch = (url) => {
      const target = String(url);
      if (target.includes('/api/auth/account-info/')) {
        return Promise.resolve(json({ full_name: 'Andrew Fernandez', username: '628123456789', balance: '1234567' }));
      }
      if (target.includes('/api/auth/balance-statistics/')) {
        return Promise.resolve(json({ total_income: '0', total_expense: '0' }));
      }
      if (target.includes('/api/transactions/')) return Promise.resolve(json({ count: 0, results: [] }));
      if (target.includes('/api/news/')) return Promise.resolve(json({ count: 0, results: [] }));
      if (target.includes('/api/support/links/')) {
        /* Fixture mirrors the real list — all three wired entries (ids
           13/12/11) are consumed by the popup. */
        return Promise.resolve(json({
          count: 3,
          next: null,
          previous: null,
          results: [
            { id: 13, title: 'Saluran Telegram', url: 'https://t.me/jelajahemasindonesia', platform: 'telegram', description: '', icon: null, is_active: true },
            { id: 12, title: 'Saluran WhatsApp', url: 'https://whatsapp.com/channel/0029VbDLjWgGpLHMw51xCe2l', platform: 'whatsapp', description: '', icon: null, is_active: true },
            { id: 11, title: 'Layanan Bantuan', url: 'https://t.me/jelajahemas', platform: 'other', description: '', icon: null, is_active: true },
          ],
        }));
      }
      return Promise.resolve(json({}, 404));
    };

    window.localStorage.setItem('je_auth_session', JSON.stringify({ access: 'e2e-token' }));

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const writeMetrics = () => {
      document.getElementById('komunitas-metrics').textContent = JSON.stringify(metrics, null, 2);
      document.title = 'KOMUNITAS-DONE';
    };
    const waitFor = async (fn, timeout = 8000) => {
      const start = performance.now();
      while (performance.now() - start < timeout) {
        const val = fn();
        if (val) return val;
        await sleep(50);
      }
      return null;
    };
    /* Ketiga tombol sudah memakai href asli dari GET /api/support/links/. */
    const hrefsLoaded = () => {
      const btns = Array.from(document.querySelectorAll('.popup-komunitas .action-buttons .btn'));
      return btns.length === 3 && btns.every((b) => b.getAttribute('href') !== '#');
    };

    history.replaceState(null, '', '/#/index/home');
    await import('/src/main.jsx');

    if (phase === '1') {
      await waitFor(() => document.querySelector('.page-home .asset-value'));

      /* 1. Popup muncul saat Home pertama dibuka di page load ini. */
      await waitFor(() => document.querySelector('.popup-komunitas .overlay'));
      metrics.state.popupOnOpen = !!document.querySelector('.popup-komunitas .overlay');
      metrics.state.subtitle = document.querySelector('.popup-komunitas .subtitle')?.textContent.trim() ?? null;
      metrics.state.title = (document.querySelector('.popup-komunitas .title')?.textContent ?? '').replace(/\s+/g, ' ').trim();
      metrics.state.badge = document.querySelector('.popup-komunitas .badge')?.textContent.trim() ?? null;
      metrics.state.buttons = Array.from(document.querySelectorAll('.popup-komunitas .action-buttons .btn'))
        .map((b) => b.textContent.replace(/\s+/g, ' ').trim());

      /* 1b. Href tombol dari GET /api/support/links/ (ids 13/12/11). */
      await waitFor(hrefsLoaded);
      metrics.state.hrefs = Array.from(document.querySelectorAll('.popup-komunitas .action-buttons .btn'))
        .map((b) => b.getAttribute('href'));

      /* 2. X menutup popup (hanya hide — bukan history.back), tetap di Home. */
      document.querySelector('.popup-komunitas .close-btn')?.click();
      await waitFor(() => !document.querySelector('.popup-komunitas'));
      metrics.state.closed = !document.querySelector('.popup-komunitas');
      metrics.state.hashAfterClose = location.hash;

      /* 3. Profil → Home tanpa refresh: popup TIDAK boleh muncul lagi.
         Routing berbasis hash — Link membuat href "#/index/profil". */
      document.querySelector('.bottom-nav a[href="#/index/profil"]')?.click();
      await waitFor(() => location.hash === '#/index/profil');
      metrics.state.hashOnProfil = location.hash;
      document.querySelector('.bottom-nav a[href="#/index/home"]')?.click();
      await waitFor(() => location.hash === '#/index/home' && document.querySelector('.page-home'));
      await sleep(600);
      metrics.state.overlayOnRevisit = !!document.querySelector('.popup-komunitas');
      metrics.state.homeRenderedAgain = !!document.querySelector('.page-home .asset-value');

      /* Fase 2: simpan hasil fase 1, lalu reload dokumen (= refresh asli). */
      sessionStorage.setItem('km_p1_state', JSON.stringify(metrics.state));
      sessionStorage.setItem('km_p1_errors', JSON.stringify(metrics.errors));
      sessionStorage.setItem('km_phase', '2');
      history.replaceState(null, '', probePath);
      location.reload();
    } else {
      /* Fase 2 — dokumen baru hasil refresh: popup harus muncul lagi. */
      const p1State = JSON.parse(sessionStorage.getItem('km_p1_state') || '{}');
      const p1Errors = JSON.parse(sessionStorage.getItem('km_p1_errors') || '[]');

      await waitFor(() => document.querySelector('.page-home .asset-value'));
      await waitFor(() => document.querySelector('.popup-komunitas .overlay'));
      const reloadState = {
        popupShownAfterReload: !!document.querySelector('.popup-komunitas .overlay'),
        hash: location.hash,
      };
      await waitFor(hrefsLoaded);
      reloadState.hrefs = Array.from(document.querySelectorAll('.popup-komunitas .action-buttons .btn'))
        .map((b) => b.getAttribute('href'));

      /* 2b. Klik di dalam kartu modal TIDAK menutup popup. */
      document.querySelector('.popup-komunitas .modal-container')?.click();
      await sleep(300);
      reloadState.openAfterModalClick = !!document.querySelector('.popup-komunitas .overlay');

      /* 2c. Tap area overlay (luar kartu) menutup popup. */
      document.querySelector('.popup-komunitas .overlay')?.click();
      await waitFor(() => !document.querySelector('.popup-komunitas'));
      reloadState.closedByOverlayTap = !document.querySelector('.popup-komunitas');

      metrics.state = { ...p1State, reloadState };
      metrics.errors = [...p1Errors, ...metrics.errors];

      metrics.allPassed =
        metrics.state.popupOnOpen === true
        && metrics.state.subtitle === 'Komunitas'
        && metrics.state.title.replace(/\s+/g, '') === 'GabungKomunitasKami' /* <br/> joins without space */
        && metrics.state.badge === 'Baru'
        && metrics.state.buttons.length === 3
        && metrics.state.buttons[0] === 'Gabung Telegram'
        && metrics.state.buttons[1] === 'Gabung WhatsApp'
        && metrics.state.buttons[2] === 'Layanan Bantuan'
        && metrics.state.hrefs[0] === 'https://t.me/jelajahemasindonesia'
        && metrics.state.hrefs[1] === 'https://whatsapp.com/channel/0029VbDLjWgGpLHMw51xCe2l'
        && metrics.state.hrefs[2] === 'https://t.me/jelajahemas'
        && metrics.state.closed === true
        && metrics.state.hashAfterClose === '#/index/home'
        && metrics.state.hashOnProfil === '#/index/profil'
        && metrics.state.overlayOnRevisit === false
        && metrics.state.homeRenderedAgain === true
        && metrics.state.reloadState.popupShownAfterReload === true
        && metrics.state.reloadState.hash === '#/index/home'
        && metrics.state.reloadState.hrefs[2] === 'https://t.me/jelajahemas'
        && metrics.state.reloadState.openAfterModalClick === true
        && metrics.state.reloadState.closedByOverlayTap === true
        && metrics.errors.length === 0;
      writeMetrics();
    }
  </script>
</body>
</html>
