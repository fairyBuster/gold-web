         dengan { amount, wallet_type: 'BALANCE_DEPOSIT', method: 'BRI' };
       - kartu VA Danamon mengirim method 'DANAMON' (daftar valid backend:
         BRI, DANAMON, MANDIRI, PERMATA);
       - halaman instruksi menampilkan nomor VA dari field `va`, nominal,
         masa berlaku (expire_time), dan langkah dari method_guide gateway;
       - kartu QRIS 2 memanggil POST /api/deposits/mgm/initiate/ dengan
         { amount, wallet_type: 'BALANCE_DEPOSIT', expiry_period: 1440 };
       - halaman QRIS menampilkan gambar dari `pay_data`, nominal, dan masa
         berlaku dari `expires_at`;
       - kartu QRIS 1 (LPAY) memanggil POST /api/deposits/lpay/initiate/
         { amount, wallet_type, expiry_period }; halaman QRIS menampilkan
         gambar qr_image (data URL), dan beralih ke QR lokal dari qr_string
         saat gambar gagal dimuat;
       - kartu QRIS 4 memanggil POST /api/deposits/ffpay/initiate/ lalu
         POST /api/deposits/ffpay/select-method/ { ref_id, method: 'QRIS' };
         halaman QRIS menampilkan QR generatan lokal dari konten pay_data
         (pay_data_type 'PG_URL') + nominal + masa berlaku dari initiate;
       - kartu Bank Transfer Manual memanggil POST /api/deposits/bankpay/
         initiate/ { amount, wallet_type, bankcode: 'bank' }; halaman Virtual
         Account menampilkan nomor VA, nominal unik display_amount, nama
         pemilik VA, dan langkah cadangan bank BRI;
       - buka langsung / refresh halaman instruksi (tanpa route state) harus
         dialihkan kembali ke Isi Ulang disertai notifikasi.
       Skenario dipilih dari hash awal: .../isi-ulang (full-flow),
       .../isi-ulang?danamon-check, .../isi-ulang?qris-check,
       .../isi-ulang?lpay-check, .../isi-ulang?ffpay-check,
       .../isi-ulang?bankpay-check, .../virtual-account (guard), atau
       .../qris?qris-guard (guard). */

    /* Mock backend: initiate-va mengembalikan payload asli di atas (body
       request direkam), sisanya /api/* dijawab {} supaya halaman tetap tenang. */
    const realFetch = window.fetch.bind(window);
    window.fetch = async (url, init = {}) => {
      const target = String(url);
      if (target.includes('/api/deposits/mgm/initiate/')) {
        try { metrics.qrisRequestBody = JSON.parse(init.body); } catch { metrics.qrisRequestBody = init.body; }
        return new Response(JSON.stringify(REAL_QRIS_RESPONSE), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        });
      }
      if (target.includes('/api/deposits/ffpay/initiate/')) {
        try { metrics.ffpayInitiateBody = JSON.parse(init.body); } catch { metrics.ffpayInitiateBody = init.body; }
        return new Response(JSON.stringify(REAL_FFPAY_INITIATE), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        });
      }
      if (target.includes('/api/deposits/ffpay/select-method/')) {
        try { metrics.ffpaySelectBody = JSON.parse(init.body); } catch { metrics.ffpaySelectBody = init.body; }
        return new Response(JSON.stringify(REAL_FFPAY_SELECT), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        });
      }
      if (target.includes('/api/deposits/lpay/initiate/')) {
        try { metrics.lpayRequestBody = JSON.parse(init.body); } catch { metrics.lpayRequestBody = init.body; }
        return new Response(JSON.stringify(REAL_LPAY_RESPONSE), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        });
      }
      if (target.includes('/api/deposits/bankpay/initiate/')) {
        try { metrics.bankpayRequestBody = JSON.parse(init.body); } catch { metrics.bankpayRequestBody = init.body; }
        return new Response(JSON.stringify(REAL_BANKPAY_RESPONSE), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        });
      }
      if (target.includes('/api/deposits/atpay/initiate-va/')) {
        try { metrics.requestBody = JSON.parse(init.body); } catch { metrics.requestBody = init.body; }
        return new Response(JSON.stringify(REAL_RESPONSE), {
          status: 200, headers: { 'Content-Type': 'application/json' },
        });
      }
      if (target.includes('/api/')) {
        return new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } });
      }
      return realFetch(url, init);

    window.localStorage.setItem('je_auth_session', JSON.stringify({ access: 'e2e-token' }));
    if (!location.hash) location.hash = '#/index/transactions/isi-ulang';

    /* Nama asset ber-hash diambil dari index.html dist, lalu bundle diimpor
       supaya SPA berjalan persis seperti produksi. */
    const html = await (await realFetch('/index.html')).text();
    for (const m of html.matchAll(/href="(\/assets\/[^"]+\.css)"/g)) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = m[1];
      document.head.appendChild(link);
    }
    const entry = html.match(/src="(\/assets\/[^"]+\.js)"/);
    if (!entry) {
      metrics.fatal = 'entry asset not found';
      document.getElementById('metrics').textContent = JSON.stringify(metrics, null, 2);
      throw new Error('no entry asset');
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const waitFor = async (fn, timeout = 10000) => {
      const start = performance.now();
      while (performance.now() - start < timeout) {
        const value = fn();
        if (value) return value;
        await sleep(50);
      }
      return null;
    };

    await import(entry[1]);

    if (metrics.scenario === 'direct-open-guard') {
      /* Tanpa route state tidak ada deposit aktif: harus bounce + notifikasi. */
      metrics.bouncedToIsiUlang = Boolean(await waitFor(() => location.hash.includes('isi-ulang')));
      metrics.guardNotifShown = Boolean(await waitFor(() => document.body.textContent.includes('Data Pembayaran Tidak Ditemukan'), 3000));

      /* Kartu VA Danamon harus mengirim method 'DANAMON'. */

      input.dispatchEvent(new Event('input', { bubbles: true }));
      document.querySelector('.page-isi-ulang .btn-primary')?.click();

         halaman QRIS menampilkan gambar pay_data + nominal + masa berlaku. */

      input.dispatchEvent(new Event('input', { bubbles: true }));

      const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const qrisExpiryExpected = `${expires.getDate()} ${MONTHS[expires.getMonth()]} ${expires.getFullYear()}, ${String(expires.getHours()).padStart(2, '0')}:${String(expires.getMinutes()).padStart(2, '0')}`;

        JSON.stringify(metrics.qrisRequestBody) === JSON.stringify({ amount: 100000, wallet_type: 'BALANCE_DEPOSIT', expiry_period: 1440 }) &&

      metrics.lpayCanvasFallback = Boolean(await waitFor(() => document.querySelector('.page-qris .qr-placeholder canvas')));
      metrics.lpayImageGone = !document.querySelector('.page-qris .qr-image');
      const lexpires = new Date('2026-09-16T16:36:55.817784Z');
      const LMONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const lpayExpiryExpected = `${lexpires.getDate()} ${LMONTHS[lexpires.getMonth()]} ${lexpires.getFullYear()}, ${String(lexpires.getHours()).padStart(2, '0')}:${String(lexpires.getMinutes()).padStart(2, '0')}`;
      metrics.passed =
        JSON.stringify(metrics.lpayRequestBody) === JSON.stringify({ amount: 100000, wallet_type: 'BALANCE_DEPOSIT', expiry_period: 1440 }) &&
        metrics.lpayNavigated &&
        metrics.lpayImageSrc === QRIS_IMG_DATA_URL &&
        metrics.lpayAmountShown === 'Rp 100.000' &&
        metrics.lpayExpiryShown === lpayExpiryExpected &&
        metrics.lpayCanvasFallback &&
        metrics.lpayImageGone &&
        metrics.errors.length === 0;
    } else if (metrics.scenario === 'ffpay-check') {

         QR pay_data) → halaman QRIS (QR generatan lokal + nominal + expiry). */

      const card = [...document.querySelectorAll('.page-isi-ulang .payment-card')]

      const input = document.querySelector('.page-isi-ulang .amount-input');

      setter.call(input, '100000');
      input.dispatchEvent(new Event('input', { bubbles: true }));
      document.querySelector('.page-isi-ulang .btn-primary')?.click();
      metrics.ffpayNavigated = Boolean(await waitFor(() => location.hash.includes('transactions/qris') && document.querySelector('.page-qris .qr-placeholder canvas')));
      metrics.ffpayQrCanvasShown = Boolean(document.querySelector('.page-qris .qr-placeholder canvas'));
      metrics.ffpayQrImageAbsent = !document.querySelector('.page-qris .qr-image');
      metrics.ffpayAmountShown = document.querySelector('.page-qris .billing-amount')?.textContent.trim() || '';
      metrics.ffpayExpiryShown = document.querySelector('.page-qris .highlight-time')?.textContent.trim() || '';
      const fexpires = new Date('2026-09-16T14:54:44.762295Z');
      const FMONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const ffpayExpiryExpected = `${fexpires.getDate()} ${FMONTHS[fexpires.getMonth()]} ${fexpires.getFullYear()}, ${String(fexpires.getHours()).padStart(2, '0')}:${String(fexpires.getMinutes()).padStart(2, '0')}`;
      metrics.passed =
        JSON.stringify(metrics.ffpayInitiateBody) === JSON.stringify({ amount: 100000, wallet_type: 'BALANCE_DEPOSIT', expiry_period: 1440 }) &&
        JSON.stringify(metrics.ffpaySelectBody) === JSON.stringify({ ref_id: 'TXN260916JJWIW8BJ', method: 'QRIS' }) &&
        metrics.ffpayNavigated &&
        metrics.ffpayQrCanvasShown &&
        metrics.ffpayQrImageAbsent &&
        metrics.ffpayAmountShown === 'Rp 100.000' &&
        metrics.ffpayExpiryShown === ffpayExpiryExpected &&
        metrics.errors.length === 0;
    } else if (metrics.scenario === 'bankpay-check') {
      /* Kartu Bank Transfer Manual: bankpay/initiate → halaman VA dengan
         nomor VA, nominal unik display_amount, dan nama pemilik VA. */
      await waitFor(() => document.querySelector('.page-isi-ulang'));
      const card = [...document.querySelectorAll('.page-isi-ulang .payment-card')]
        .find((el) => el.querySelector('.method-name')?.textContent.trim() === 'Bank Transfer Manual');
      card?.click();
      const input = document.querySelector('.page-isi-ulang .amount-input');
      const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
      setter.call(input, '50000');
      input.dispatchEvent(new Event('input', { bubbles: true }));
      document.querySelector('.page-isi-ulang .btn-primary')?.click();
      metrics.bankpayNavigated = Boolean(await waitFor(() => location.hash.includes('virtual-account') && document.querySelector('.page-virtual-account .number')));
      metrics.bankpayVaShown = document.querySelector('.page-virtual-account .number')?.textContent.trim() || '';
      metrics.bankpayTitle = document.querySelector('.page-virtual-account .card-header h2')?.textContent.trim() || '';
      metrics.bankpayAmountShown = document.querySelector('.page-virtual-account .amount')?.textContent.trim() || '';
      metrics.bankpayStatusDesc = document.querySelector('.page-virtual-account .status-desc')?.textContent.trim() || '';
      metrics.bankpayNameShown = document.querySelector('.page-virtual-account .account-name')?.textContent.trim() || '';
      metrics.bankpayFirstStep = document.querySelector('.page-virtual-account .step-item p')?.textContent.trim() || '';
      metrics.passed =
        JSON.stringify(metrics.bankpayRequestBody) === JSON.stringify({ amount: 50000, wallet_type: 'BALANCE_DEPOSIT', bankcode: 'bank' }) &&
        metrics.bankpayNavigated &&
        metrics.bankpayVaShown === '479401000081562' &&
        metrics.bankpayTitle === 'Virtual Account BRI' &&
        metrics.bankpayAmountShown === 'Rp 50.862' &&
        metrics.bankpayStatusDesc.includes('sesuai nominal') &&
        metrics.bankpayNameShown === 'a.n. IRWATI YUNITA' &&
        metrics.bankpayFirstStep === 'Buka aplikasi BRImo, lalu pilih menu pembayaran BRIVA.' &&
        metrics.errors.length === 0;
    } else if (metrics.scenario === 'qris-guard') {
      /* Tanpa route state tidak ada pembayaran aktif: harus bounce + notifikasi. */
      metrics.bouncedToIsiUlang = Boolean(await waitFor(() => location.hash.includes('isi-ulang')));
      metrics.guardNotifShown = Boolean(await waitFor(() => document.body.textContent.includes('Data Pembayaran Tidak Ditemukan'), 3000));
      metrics.passed = metrics.bouncedToIsiUlang && metrics.guardNotifShown && metrics.errors.length === 0;
    } else {
      await waitFor(() => document.querySelector('.page-isi-ulang'));
      metrics.methodNames = [...document.querySelectorAll('.page-isi-ulang .method-name')].map((el) => el.textContent.trim());

      const card = [...document.querySelectorAll('.page-isi-ulang .payment-card')]
        .find((el) => el.querySelector('.method-name')?.textContent.trim() === 'VA BRI');
      card?.click();
      const input = document.querySelector('.page-isi-ulang .amount-input');
      const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
      setter.call(input, '10000');
      input.dispatchEvent(new Event('input', { bubbles: true }));

      document.querySelector('.page-isi-ulang .btn-primary')?.click();
      metrics.navigatedToVa = Boolean(await waitFor(() => location.hash.includes('virtual-account') && document.querySelector('.page-virtual-account .number')));
      metrics.vaNumberShown = document.querySelector('.page-virtual-account .number')?.textContent.trim() || '';
      metrics.cardTitle = document.querySelector('.page-virtual-account .card-header h2')?.textContent.trim() || '';
      metrics.amountShown = document.querySelector('.page-virtual-account .amount')?.textContent.trim() || '';
      metrics.expiryShown = document.querySelector('.page-virtual-account .status-desc')?.textContent.trim() || '';
      metrics.firstStepMobile = document.querySelector('.page-virtual-account .step-item p')?.textContent.trim() || '';
      metrics.mobileStepCount = document.querySelectorAll('.page-virtual-account .step-item').length;

      [...document.querySelectorAll('.page-virtual-account .tab')].find((t) => t.textContent.trim() === 'ATM')?.click();
      await sleep(150);
      metrics.firstStepAtm = document.querySelector('.page-virtual-account .step-item p')?.textContent.trim() || '';

      [...document.querySelectorAll('.page-virtual-account .tab')].find((t) => t.textContent.trim() === 'Internet Banking')?.click();
      await sleep(150);
      metrics.firstStepIbank = document.querySelector('.page-virtual-account .step-item p')?.textContent.trim() || '';

      const EXPECTED_METHODS = ['VA BRI', 'VA Permata', 'VA Mandiri', 'VA Danamon'];
      metrics.passed =
        EXPECTED_METHODS.every((name, i) => metrics.methodNames[i] === name) &&
        JSON.stringify(metrics.requestBody) === JSON.stringify({ amount: '10000.00', wallet_type: 'BALANCE_DEPOSIT', method: 'BRI' }) &&
        metrics.navigatedToVa &&
        metrics.vaNumberShown === '1456118590022359' &&
        metrics.cardTitle === 'Virtual Account BRI' &&
        metrics.amountShown === 'Rp 10.000' &&
        metrics.expiryShown.includes('17 Sep 2026, 19:38') &&
        metrics.firstStepMobile === 'Login BRI Mobile' &&
        metrics.mobileStepCount === 11 &&
        metrics.firstStepAtm === 'Input kartu ATM dan PIN Anda' &&
        metrics.firstStepIbank === 'Login Internet Banking' &&
        metrics.errors.length === 0;
    }

    document.getElementById('metrics').textContent = JSON.stringify(metrics, null, 2);
    document.title = 'VA-E2E-DONE ' + JSON.stringify({ passed: metrics.passed, scenario: metrics.scenario });
  </script>
</body>
</html>
